<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Выбор названия</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-hover: #212631;
      --border: #2a303c;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(15, 17, 21, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .title { font-weight: 700; font-size: 16px; }
    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1f2937;
      color: var(--muted);
    }
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }
    .btn:hover { background: var(--card-hover); }
    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
      font-size: 15px;
      padding: 13px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-wrap {
      margin-bottom: 18px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px;
      background: var(--card);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }
    .arena {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      my-auto: 0;
      flex: 1;
      align-content: center;
    }
    @media (min-width: 600px) {
      .arena { grid-template-columns: 1fr 1fr; }
    }
    .choice-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 28px 20px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .choice-card:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .choice-card:active { transform: scale(0.98); }
    .choice-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }
    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    .leaderboard th, .leaderboard td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .leaderboard th { color: var(--muted); font-weight: 600; }
    .rank-num { font-weight: 700; color: var(--accent); width: 32px; }
    .status-box {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      background: #1f2937;
      border: 1px solid var(--border);
      text-align: center;
    }
    .status-ok { border-color: var(--success); color: #6ee7b7; }
    .status-err { border-color: var(--danger); color: #fca5a5; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="title">Битва названий</div>
  <div class="badge" id="userBadge">Гость</div>
</header>

<main>
  <!-- Экран выбора режима / старта -->
  <div id="battleScreen">
    <div class="mode-switch">
      <button class="btn active" id="btnSwiss" onclick="setMode('swiss')">Быстрый (~42 пары)</button>
      <button class="btn" id="btnAll" onclick="setMode('all')">Все пары (210)</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="stepText">Пара 1 из 42</span>
        <span id="pctText">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="arena">
      <div class="choice-card" onclick="pick(0)">
        <div class="choice-text" id="opt0">—</div>
      </div>
      <div class="choice-card" onclick="pick(1)">
        <div class="choice-text" id="opt1">—</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnUndo" onclick="undo()" disabled>← Назад</button>
      <button class="btn" onclick="finishEarly()">Завершить досрочно</button>
    </div>
  </div>

  <!-- Экран результатов -->
  <div id="resultScreen" class="hidden">
    <div class="status-box" id="syncStatus">Отправка результатов в Google Таблицу...</div>
    <button class="btn primary hidden" id="btnRetry" onclick="sendToSheets()" style="width:100%; margin-bottom:14px;">Повторить отправку</button>

    <table class="leaderboard">
      <thead>
        <tr>
          <th>#</th>
          <th>Название</th>
          <th>Победы</th>
          <th>Игры</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>

    <div style="margin-top: 18px;">
      <button class="btn" style="width:100%" onclick="restart()">Пройти заново</button>
    </div>
  </div>
</main>

<script>
  // === ВСТАВЬ СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT НИЖЕ ===
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFglosl_5K1QDQPJaN8o_RI3ZUmnx7x0TpvKfhRwQTyqSaIvX2GFtwWpf99vmLSQ4wVA/exec";

  const NAMES = [
    "StarGuide",
    "большая психиатрия",
    "Битый байт",
    "Звёздное гало",
    "Абортыши Империи",
    "Хроники хуевых решений",
    "Пыль звездных систем",
    "Чем дальше в космос, тем больше уебков",
    "Точка безумных иллюзий/конструкций",
    "Останки великих созвездий",
    "сборище Звездюков",
    "Звезданутые",
    "Общество звездных шизофреников",
    "Зазвездившийся орден",
    "Лига звезданутых",
    "Инвалиды под звездной пылью",
    "Звездный Храм",
    "Переселенцы с Империи",
    "Звёздные",
    "Земной путь",
    "Звёзды и Корпус"
  ];

  // Инициализация Telegram WebApp
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  let tgUser = { name: "Аноним (браузер)", username: "" };
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      tgUser.name = [u.first_name, u.last_name].filter(Boolean).join(" ") || "Без имени";
      tgUser.username = u.username || "";
    }
  }
  document.getElementById("userBadge").textContent = tgUser.username ? "@" + tgUser.username : tgUser.name;

  let mode = "swiss";
  let stats = {};
  let history = [];
  let queue = [];
  let swissRound = 0;
  const SWISS_MAX_ROUNDS = 4; // 4 раунда по ~10-11 пар = ~42 сравнения
  let currentPair = null;
  let lastPayload = null;

  function initStats() {
    stats = {};
    NAMES.forEach(n => stats[n] = { name: n, wins: 0, played: 0 });
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Генерация всех 210 пар с анти-повтором подряд
  function buildAllPairs() {
    let raw = [];
    for (let i = 0; i < NAMES.length; i++) {
      for (let j = i + 1; j < NAMES.length; j++) {
        raw.push(Math.random() > 0.5 ? [NAMES[i], NAMES[j]] : [NAMES[j], NAMES[i]]);
      }
    }
    shuffle(raw);
    let ordered = [];
    while (raw.length > 0) {
      let last = ordered[ordered.length - 1];
      let idx = raw.findIndex(p => !last || (!last.includes(p[0]) && !last.includes(p[1])));
      if (idx === -1) idx = 0;
      ordered.push(raw.splice(idx, 1)[0]);
    }
    return ordered;
  }

  // Генерация раунда швейцарской системы
  function buildSwissRound() {
    let sorted = Object.values(stats).sort((a, b) => {
      if (b.wins !== a.wins) return b.wins - a.wins;
      return Math.random() - 0.5;
    });
    let pairs = [];
    for (let i = 0; i < sorted.length - 1; i += 2) {
      const pair = Math.random() > 0.5
        ? [sorted[i].name, sorted[i + 1].name]
        : [sorted[i + 1].name, sorted[i].name];
      pairs.push(pair);
    }
    // Нечетный 21-й элемент получает дополнительный матч со случайным соседом из середины
    const odd = sorted[sorted.length - 1].name;
    const opp = sorted[Math.floor(sorted.length / 2)].name;
    pairs.push([odd, opp]);
    return shuffle(pairs);
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById("btnSwiss").classList.toggle("active", mode === "swiss");
    document.getElementById("btnAll").classList.toggle("active", mode === "all");
    restart();
  }

  function restart() {
    initStats();
    history = [];
    swissRound = 1;
    queue = mode === "all" ? buildAllPairs() : buildSwissRound();
    document.getElementById("battleScreen").classList.remove("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    nextPair();
  }

  function nextPair() {
    if (queue.length === 0) {
      if (mode === "swiss" && swissRound < SWISS_MAX_ROUNDS) {
        swissRound++;
        queue = buildSwissRound();
      } else {
        showResults();
        return;
      }
    }
    currentPair = queue.shift();
    document.getElementById("opt0").textContent = currentPair[0];
    document.getElementById("opt1").textContent = currentPair[1];
    updateProgress();
  }

  function updateProgress() {
    const done = history.length;
    const total = mode === "all" ? 210 : SWISS_MAX_ROUNDS * 11;
    const pct = Math.min(100, Math.round((done / total) * 100));
    document.getElementById("stepText").textContent = `Сравнение ${done + 1} из ~${total}`;
    document.getElementById("pctText").textContent = `${pct}%`;
    document.getElementById("progressFill").style.width = `${pct}%`;
    document.getElementById("btnUndo").disabled = history.length === 0;
  }

  function pick(idx) {
    if (!currentPair) return;
    const winner = currentPair[idx];
    const loser = currentPair[1 - idx];

    stats[winner].wins += 1;
    stats[winner].played += 1;
    stats[loser].played += 1;

    history.push({ pair: currentPair, winner, loser });
    nextPair();
  }

  function undo() {
    if (history.length === 0) return;
    const last = history.pop();
    stats[last.winner].wins -= 1;
    stats[last.winner].played -= 1;
    stats[last.loser].played -= 1;
    if (currentPair) queue.unshift(currentPair);
    currentPair = last.pair;
    document.getElementById("opt0").textContent = currentPair[0];
    document.getElementById("opt1").textContent = currentPair[1];
    updateProgress();
  }

  function finishEarly() {
    if (history.length === 0) return;
    showResults();
  }

  function showResults() {
    document.getElementById("battleScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    const ranking = Object.values(stats).sort((a, b) => {
      if (b.wins !== a.wins) return b.wins - a.wins;
      const wrA = a.played ? a.wins / a.played : 0;
      const wrB = b.played ? b.wins / b.played : 0;
      return wrB - wrA;
    });

    const tbody = document.getElementById("resultBody");
    tbody.innerHTML = ranking.map((item, idx) => `
      <tr>
        <td class="rank-num">${idx + 1}</td>
        <td><strong>${item.name}</strong></td>
        <td>${item.wins}</td>
        <td>${item.played}</td>
      </tr>
    `).join("");

    lastPayload = {
      userName: tgUser.name,
      username: tgUser.username,
      mode: mode === "all" ? "Все пары (210)" : "Быстрый турнир",
      ranking: ranking
    };

    sendToSheets();
  }

  async function sendToSheets() {
    const statusBox = document.getElementById("syncStatus");
    const retryBtn = document.getElementById("btnRetry");
    retryBtn.classList.add("hidden");

    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("ВСТАВЬ_СЮДА")) {
      statusBox.className = "status-box status-err";
      statusBox.textContent = "Ссылка на Google Apps Script не указана в коде.";
      return;
    }

    statusBox.className = "status-box";
    statusBox.textContent = "Сохранение результатов в общую таблицу...";

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(lastPayload)
      });
      statusBox.className = "status-box status-ok";
      statusBox.textContent = "Готово! Твой голос записан в общую таблицу.";
    } catch (err) {
      statusBox.className = "status-box status-err";
      statusBox.textContent = "Ошибка отправки. Проверь интернет и нажми кнопку ниже.";
      retryBtn.classList.remove("hidden");
    }
  }

  // Клавиатура для ПК
  document.addEventListener("keydown", (e) => {
    if (document.getElementById("battleScreen").classList.contains("hidden")) return;
    if (e.key === "ArrowLeft" || e.key === "1") pick(0);
    if (e.key === "ArrowRight" || e.key === "2") pick(1);
    if (e.key.toLowerCase() === "z" || e.key === "Backspace") undo();
  });

  restart();
</script>
</body>
</html>
